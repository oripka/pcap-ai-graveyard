<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Share card</title>
<!-- Source of docs/og.png. Render: scripts/og.sh (headless Chrome, 1200x630). -->
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { position: relative; color: #e6e9f2; font-family: Georgia, 'Times New Roman', serif;
  background: radial-gradient(900px 520px at 86% 6%, #2a3350 0%, transparent 62%), linear-gradient(180deg, #0b0f1e 0%, #111831 58%, #0d1a16 100%); }
.star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; }
.moon { position: absolute; right: 86px; top: 54px; width: 150px; height: 150px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fffbe8, #f3ecd2 60%, #cfc7a4); box-shadow: 0 0 120px 40px rgba(243, 236, 210, .2); }
.moon i { position: absolute; border-radius: 50%; background: rgba(120, 112, 80, .25); }
.kicker { position: absolute; left: 72px; top: 64px; font: 600 20px/1 ui-monospace, Menlo, monospace; letter-spacing: .2em; color: #8f98b3; }
h1 { position: absolute; left: 70px; top: 94px; margin: 0; font-size: 84px; line-height: 1; letter-spacing: -.01em; }
h1 span { display: block; }
.tag { position: absolute; left: 72px; top: 280px; font-size: 31px; font-style: italic; color: #f3ecd2; }
.nums { position: absolute; left: 72px; top: 334px; font: 600 22px/1 ui-monospace, Menlo, monospace; color: #b9c0d0; }
.nums b { color: #d9825b; } .nums u { text-decoration: none; color: #6fbf8b; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: linear-gradient(180deg, #17301f, #0c1a11); }
.ground::before { content: ""; position: absolute; left: 0; right: 0; top: -22px; height: 26px;
  background: repeating-linear-gradient(78deg, transparent 0 7px, #2f6b3f 7px 10px, transparent 10px 16px), repeating-linear-gradient(102deg, transparent 0 10px, #3d8450 10px 12px, transparent 12px 21px);
  -webkit-mask-image: linear-gradient(180deg, transparent, #000 75%); mask-image: linear-gradient(180deg, transparent, #000 75%); }
.row { position: absolute; left: 0; right: 0; bottom: 78px; height: 190px; }
.st { position: absolute; bottom: 0; transform-origin: 50% 100%; text-align: center; color: #1c2130;
  background: linear-gradient(168deg, #aab1c0 0%, #8e96a8 30%, #6f778a 68%, #555d70 100%);
  box-shadow: inset 4px 4px 0 rgba(255, 255, 255, .22), inset -6px -4px 0 rgba(0, 0, 0, .22), 12px 18px 26px -10px rgba(0, 0, 0, .8); }
.st b { display: block; font: 700 15px/1 Georgia, serif; letter-spacing: .3em; opacity: .65; }
.st em { display: block; font: 700 21px/1.1 Georgia, serif; font-style: normal; margin-top: 10px; }
.st small { display: block; font: 600 12px/1.3 ui-monospace, Menlo, monospace; margin-top: 6px; opacity: .8; }
.st.moss::after { content: ""; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(90px 60px at 8% 100%, rgba(58, 112, 62, .95), transparent 72%), radial-gradient(120px 70px at 94% 100%, rgba(50, 100, 60, .9), transparent 72%), radial-gradient(70px 110px at 100% 45%, rgba(62, 108, 70, .6), transparent 70%); }
.cross::before { content: ""; position: absolute; left: 50%; top: -52px; width: 24px; height: 54px; margin-left: -12px; background: linear-gradient(168deg, #aab1c0, #6f778a); border-radius: 3px 3px 0 0; }
.cross i { position: absolute; left: 50%; top: -38px; width: 62px; height: 19px; margin-left: -31px; background: linear-gradient(168deg, #aab1c0, #7b8396); border-radius: 3px; }
.board { position: absolute; bottom: 44px; text-align: center; color: #2a1a0c; border-radius: 8px;
  background: linear-gradient(170deg, #c99a62 0%, #b07f48 45%, #8f6234 100%);
  box-shadow: inset 3px 3px 0 rgba(255, 255, 255, .25), inset -4px -4px 0 rgba(0, 0, 0, .25), 0 0 46px -4px rgba(240, 180, 90, .55), 10px 16px 24px -10px rgba(0, 0, 0, .8); }
.board b { display: block; font: 700 13px/1 Georgia, serif; letter-spacing: .26em; color: #1f5d33; }
.board em { display: block; font: 700 22px/1.1 Georgia, serif; font-style: normal; margin-top: 9px; }
.board svg { display: block; width: 96px; height: 20px; margin: 9px auto 0; }
.post { position: absolute; bottom: -10px; width: 15px; height: 58px; background: #6b4526; }
.url { position: absolute; right: 72px; bottom: 22px; font: 600 19px/1 ui-monospace, Menlo, monospace; color: #9fb7a6; z-index: 3; }
</style>
</head>
<body>
<div id="stars"></div>
<div class="moon"><i style="left:92px;top:38px;width:26px;height:26px"></i><i style="left:44px;top:86px;width:36px;height:36px"></i><i style="left:104px;top:92px;width:16px;height:16px"></i></div>
<div class="kicker">EST. 2026 · A CENSUS</div>
<h1><span>The PCAP AI</span><span>Graveyard</span></h1>
<div class="tag">Each one was going to replace Wireshark. Wireshark has not noticed.</div>
<div class="nums" id="nums"></div>

<div class="row">
  <div class="st moss" style="left:60px;width:170px;height:150px;border-radius:85px 85px 5px 5px / 70px 70px 5px 5px;padding-top:38px;transform:rotate(-5deg)"><b>R.I.P</b><em>v0.1</em><small>one commit</small></div>
  <div class="st cross" style="left:262px;width:150px;height:120px;border-radius:12px 12px 5px 5px;padding-top:26px;transform:rotate(3deg)"><i></i><b>R.I.P</b><em>the MVP</em><small>lived for a day</small></div>
  <div class="st moss" style="left:446px;width:160px;height:136px;border-radius:30px 30px 5px 5px;padding-top:30px;transform:rotate(-2deg);filter:brightness(.8)"><b>R.I.P</b><em>final_v2</em><small>out of tokens</small></div>
  <div class="post" style="left:668px"></div><div class="post" style="left:803px"></div>
  <div class="board" style="left:640px;width:206px;height:124px;padding-top:22px;transform:rotate(1.5deg)"><b>STILL BREATHING</b><em>a few of them</em><svg viewBox="0 0 96 20"><path d="M0 11 h28 l5 -9 l6 16 l6 -13 l4 6 h47" fill="none" stroke="#1f6d3a" stroke-width="2.4" stroke-linejoin="round"/></svg></div>
  <div class="st" style="left:884px;width:150px;height:128px;border-radius:50% 50% 5px 5px / 46px 46px 5px 5px;padding-top:36px;transform:rotate(4deg)"><b>R.I.P</b><em>the demo</em><small>0 ★ · one push</small></div>
  <div class="st moss cross" style="left:1062px;width:120px;height:104px;border-radius:10px 10px 5px 5px;padding-top:24px;transform:rotate(-6deg);filter:brightness(.7)"><i></i><b>R.I.P</b><em>beta</em><small>2024</small></div>
</div>
<div class="ground"></div>
<div class="url">oripka.github.io/pcap-ai-graveyard</div>

<script src="data.js"></script>
<script>
// fixed star field, so the card renders the same every time
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647
const stars = document.getElementById('stars')
for (let i = 0; i < 70; i++) { const s = document.createElement('i'); s.className = 'star'; s.style.left = rnd() * 1200 + 'px'; s.style.top = rnd() * 300 + 'px'; s.style.opacity = .25 + rnd() * .6; const z = 1 + rnd() * 2.2; s.style.width = s.style.height = z + 'px'; stars.append(s) }
const s = (window.GRAVEYARD || {}).stats
if (s) document.getElementById('nums').innerHTML = `${s.total} tools found · <u>${s.alive} still breathing</u> · <b>${s.one_day} lived one day</b>`
</script>
</body>
</html>
