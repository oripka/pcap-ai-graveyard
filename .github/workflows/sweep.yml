name: Weekly sweep
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Search GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sweep.mjs | tee sweep.log
      - name: Count the months anyone worked
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/activity.mjs || true
      - name: Knock on the websites
        run: node scripts/check-sites.mjs
      - name: Carve the stones
        run: node scripts/build.mjs
      - name: Redraw the share image
        run: sh scripts/og.sh || true
      - name: Commit
        run: |
          rm -f sweep.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Weekly sweep $(date -u +%F)"
          git push
